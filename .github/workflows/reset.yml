name: Reset database

on:
  workflow_dispatch:

jobs:
  reset:
    runs-on: ubuntu-latest
    environment: github-pages
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Reset database
        run: supabase db reset --project-ref ${{ vars.SUPABASE_PROJECT_REF }} --yes
